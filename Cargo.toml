[package]
name = "nanoid"
version = "0.1.0"
edition = "2021"
description = "Small Nano ID generator compiled to portable raw WebAssembly"
license = "MIT"
repository = "https://github.com/autotrof/nanoid"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
