name: CI

on:
  push:
    branches: [main, "release/v*.*.*"]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Test Rust crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets

  wasm-smoke:
    name: Build and smoke test raw WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release --target wasm32-unknown-unknown
      - run: node scripts/wasm-smoke.mjs

  wasm-release:
    name: Build and publish raw WebAssembly
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: [test, wasm-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release --target wasm32-unknown-unknown
      - name: Stage portable raw module
        run: cp target/wasm32-unknown-unknown/release/nanoid.wasm nanoid.wasm
      - name: Choose release tag
        id: release-tag
        shell: bash
        run: echo "tag=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: nanoid.wasm
